name: Build Standalone index.html

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is named master
    paths-ignore:
      - 'index.html' # Prevents infinite loops when the bot commits index.html

permissions:
  contents: write # Allows the workflow to commit index.html back to your repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build standalone index.html
        run: npm run build

      - name: Commit updated index.html
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: rebuild standalone index.html [skip ci]"
          git push
